name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: Run tests
        # Everything here runs offline with no fixtures and no configuration.
        # If this suite ever needs an environment variable, something that is
        # not dice has moved into the package.
        run: pytest -q --tb=short --cov=kirby_dice --cov-report=term-missing
